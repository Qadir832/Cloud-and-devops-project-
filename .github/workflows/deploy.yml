name: Bilal Cloud DevOps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bilal-dashboard
  EC2_NAME: bilalserver
  CONTAINER_NAME: bilal-dashboard

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Get project code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS connection
      - name: Verify AWS
        run: aws sts get-caller-identity

      # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 6. Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      # 7. Plan infrastructure
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 8. Create AWS infrastructure
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # 9. Get AWS account ID
      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" \
            >> "$GITHUB_OUTPUT"

      # 10. Create ECR repository if needed
      - name: Create ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 ||
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # 11. Login to ECR
      - name: Login to Amazon ECR
        env:
          REGISTRY: ${{ steps.account.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      # 12. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t "$ECR_REPOSITORY:${GITHUB_SHA}" .

      # 13. Push image to ECR
      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.account.outputs.registry }}
        run: |
          docker tag "$ECR_REPOSITORY:${GITHUB_SHA}" \
            "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

      # 14. Find the EC2 server
      - name: Find Bilal Server
        id: server
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "EC2 instance $EC2_NAME not found."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 15. Deploy using AWS Systems Manager
      - name: Deploy Docker Container
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
          REGISTRY: ${{ steps.account.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > commands.json <<EOF
          {
            "commands": [
              "set -e",
              "systemctl enable --now docker",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
              "docker pull $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "docker rm -f $CONTAINER_NAME || true",
              "docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 80:80 $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "docker ps"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json || true
              exit 1
            fi

            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out."
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text

      # 16. Show dashboard URL
      - name: Dashboard URL
        env:
          INSTANCE_ID: ${{ steps.server.outputs.instance_id }}
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "Bilal Dashboard: http://$PUBLIC_IP"
